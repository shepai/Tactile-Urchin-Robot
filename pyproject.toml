[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "urchin-bot"
version = "0.1.0"
description = "Sea urchin inspired robot simulation model and physical part designs"
readme = "README.md"
requires-python = ">=3.9"
authors = [
    {name = "Dexter Shepherd"}
]
dependencies = [
    "numpy>=2.0",
    "torch>=2.7",
    "mujoco",
    "gymnasium"

]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]